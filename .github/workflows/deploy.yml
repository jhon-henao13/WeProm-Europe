name: Deploy Website

on:
  push:
    branches:
      - main  # Se ejecutará cada vez que hagas push a la rama main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build  # Esto genera la carpeta 'dist'

      - name: Deploy to WPX via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 2222 
          # Cambiamos "sftp" por "ftps" que es lo que la acción reconoce para conexiones seguras
          protocol: ftps
          # Añadimos esta línea por si el certificado del servidor es auto-firmado
          security: loose 
          local-dir: ./dist/  
          server-dir: ./public_html/